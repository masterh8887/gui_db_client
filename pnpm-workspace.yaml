packages:
  - "apps/*"
  - "packages/*"
  - "crates/*" # thin package.json wrappers around cargo so turbo can drive them

# Packages whose install scripts may run (pnpm 12 blocks everything else).
allowBuilds:
  esbuild: true
  unrs-resolver: true
  "@tailwindcss/oxide": true
  sharp: true

# `pnpm audit --audit-level high` is a CI gate (spec section 13). Every entry below is a known
# advisory that is tolerated on purpose; each needs a reason, and is removed as soon as the fix
# lands in the lockfile. Add new entries with `pnpm audit --ignore <GHSA>`, never by turning the
# gate off.
auditConfig:
  ignoreGhsas: []

minimumReleaseAgeExclude:
  - "@next/env@16.4.5"
  - "@next/eslint-plugin-next@16.4.5"
  - "@next/swc-darwin-arm64@16.4.5"
  - "@next/swc-darwin-x64@16.4.5"
  - "@next/swc-linux-arm64-gnu@16.4.5"
  - "@next/swc-linux-arm64-musl@16.4.5"
  - "@next/swc-linux-x64-gnu@16.4.5"
  - "@next/swc-linux-x64-musl@16.4.5"
  - "@next/swc-win32-arm64-msvc@16.4.5"
  - "@next/swc-win32-x64-msvc@16.4.5"
  - eslint-config-next@16.4.5
  - lucide-react@1.67.0
  - next@16.4.5
